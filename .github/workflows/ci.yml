name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Que estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Bajar el codigo
        uses: actions/checkout@v6

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr tests del backend con coverage
        run: |
          mkdir -p backend-coverage
          docker run --rm \
            -v "${{ github.workspace }}/backend-coverage:/out" \
            backend-test:ci

      - name: Publicar resumen del backend
        if: ${{ !cancelled() }}
        run: |
          test -f backend-coverage/summary.md
          cat backend-coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar coverage del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      - name: Iniciar sesion en GHCR
        if: >-
          ${{ github.event_name == 'push' &&
              github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: >-
            ${{ github.event_name == 'push' &&
                github.ref == 'refs/heads/main' }}
          tags: ghcr.io/germorini/ingsoft3-tp01-backend:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Que estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Bajar el codigo
        uses: actions/checkout@v6

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr tests del frontend con coverage
        run: |
          mkdir -p frontend-coverage
          docker run --rm \
            -e COVERAGE_DIR=/out/report \
            -v "${{ github.workspace }}/frontend-coverage:/out" \
            frontend-test:ci

      - name: Publicar resumen del frontend
        if: ${{ !cancelled() }}
        run: |
          summary=frontend-coverage/report/coverage-summary.json
          test -f "$summary"
          node -e "
            const total = require('./$summary').total;
            if (!total.lines.total) {
              console.error('Coverage midió cero archivos.');
              process.exit(1);
            }
            const row = (name) => '| ' + name + ' | ' + total[name].pct + '% |';
            console.log('### Coverage del frontend');
            console.log('| Métrica | Resultado |');
            console.log('|---|---:|');
            console.log(row('lines'));
            console.log(row('branches'));
            console.log(row('functions'));
            console.log(row('statements'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Iniciar sesion en GHCR
        if: >-
          ${{ github.event_name == 'push' &&
              github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: >-
            ${{ github.event_name == 'push' &&
                github.ref == 'refs/heads/main' }}
          tags: ghcr.io/germorini/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' }}
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: qa
      url: ${{ vars.FRONT_URL }}
    steps:
      - name: Desplegar en QA las imagenes verificadas
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT }}
        run: |
          IMG_API="ghcr.io/germorini/ingsoft3-tp01-backend:sha-${GITHUB_SHA}"
          IMG_FRONT="ghcr.io/germorini/ingsoft3-tp01-frontend:sha-${GITHUB_SHA}"
          curl --fail --silent --show-error --max-time 30 \
            --get --data-urlencode "imgURL=${IMG_API}" "${HOOK_API}"
          curl --fail --silent --show-error --max-time 30 \
            --get --data-urlencode "imgURL=${IMG_FRONT}" "${HOOK_FRONT}"

      - name: Esperar y verificar QA
        env:
          API_URL: ${{ vars.API_URL }}
          FRONT_URL: ${{ vars.FRONT_URL }}
        run: |
          for attempt in $(seq 1 30); do
            echo "Intento ${attempt}/30"
            if curl --fail --silent --show-error --max-time 10 \
                "${API_URL}/health" >/dev/null \
              && curl --fail --silent --show-error --max-time 10 \
                "${API_URL}/api/ready" >/dev/null \
              && curl --fail --silent --show-error --max-time 10 \
                "${FRONT_URL}/" >/dev/null \
              && curl --fail --silent --show-error --max-time 10 \
                "${FRONT_URL}/api/ready" >/dev/null; then
              echo "QA responde: API, base, frontend y proxy"
              exit 0
            fi
            sleep 20
          done

          echo "QA no respondio correctamente" >&2
          exit 1

  integracion:
    needs: deploy-qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: qa
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: ./frontend

      - name: Probar API y base de QA
        env:
          API_BASE_URL: ${{ vars.API_URL }}
          QA_TEST_USERNAME: ${{ secrets.QA_TEST_USERNAME }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend

      - name: Publicar reporte de integracion
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report
          retention-days: 7

  e2e:
    needs: integracion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: qa
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias y Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: Probar flujos completos contra QA
        env:
          E2E_BASE_URL: ${{ vars.FRONT_URL }}
          QA_TEST_USERNAME: ${{ secrets.QA_TEST_USERNAME }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
        run: npx playwright test e2e/fitpro.spec.js
        working-directory: ./frontend

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 7

  deploy-prod:
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: ${{ vars.FRONT_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Desplegar en PROD las imagenes aprobadas
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT }}
        run: |
          IMG_API="ghcr.io/germorini/ingsoft3-tp01-backend:sha-${GITHUB_SHA}"
          IMG_FRONT="ghcr.io/germorini/ingsoft3-tp01-frontend:sha-${GITHUB_SHA}"
          curl --fail --silent --show-error --max-time 30 \
            --get --data-urlencode "imgURL=${IMG_API}" "${HOOK_API}"
          curl --fail --silent --show-error --max-time 30 \
            --get --data-urlencode "imgURL=${IMG_FRONT}" "${HOOK_FRONT}"

      - name: Esperar y verificar PROD
        env:
          API_URL: ${{ vars.API_URL }}
          FRONT_URL: ${{ vars.FRONT_URL }}
        run: |
          for attempt in $(seq 1 30); do
            echo "Intento ${attempt}/30"
            if curl --fail --silent --show-error --max-time 10 \
                "${API_URL}/health" >/dev/null \
              && curl --fail --silent --show-error --max-time 10 \
                "${API_URL}/api/ready" >/dev/null \
              && curl --fail --silent --show-error --max-time 10 \
                "${FRONT_URL}/" >/dev/null \
              && curl --fail --silent --show-error --max-time 10 \
                "${FRONT_URL}/api/ready" >/dev/null; then
              echo "PROD responde: API, base, frontend y proxy"
              exit 0
            fi
            sleep 20
          done

          echo "PROD no respondio correctamente" >&2
          exit 1
